<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>FogTap — rebuilding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #F7F4EF;
      --mist: #C5CED6;
      --ink: #1C1C1C;
      --amber: #D4A35A;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
    }
    main {
      max-width: 32rem;
      text-align: center;
    }
    .logo {
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 2.75rem);
      line-height: 1.15;
      margin: 0 0 1rem;
    }
    p {
      margin: 0;
      color: #4a4a4a;
      line-height: 1.55;
    }
    .bar {
      width: 3rem;
      height: 3px;
      background: var(--amber);
      margin: 1.5rem auto;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">FogTap</div>
    <h1>We’re rebuilding this page.</h1>
    <div class="bar" aria-hidden="true"></div>
    <p>The old demo didn’t meet the bar. A cleaner FogTap experience is on the way — soft frost on real glass, no scrapbook paste-ups.</p>
  </main>
</body>
</html>
